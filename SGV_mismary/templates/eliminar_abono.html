<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eliminar Abono | MisMary</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #d8c3a5;
            min-height: 100vh;
            color: #5c4033;
        }

        .navbar {
            width: 100%;
            background: #5c4033;
            padding: 18px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 10px rgba(70, 50, 30, 0.3);
        }

        .logo {
            color: #f5ead7;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .usuario {
            color: #f5ead7;
            font-size: 14px;
        }

        .contenido {
            max-width: 600px;
            margin: 60px auto;
            padding: 0 25px;
        }

        .tarjeta {
            background: #f5ead7;
            border: 2px solid #8b6f47;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            box-shadow:
                0 5px 15px
                rgba(70, 50, 30, 0.2);
        }

        .icono {
            font-size: 50px;
            margin-bottom: 20px;
        }

        h1 {
            color: #5c4033;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .texto {
            color: #806b55;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .informacion {
            background: #eadbc3;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .informacion p {
            color: #5c4033;
            margin-bottom: 8px;
        }

        .informacion p:last-child {
            margin-bottom: 0;
        }

        .botones {
            display: flex;
            gap: 10px;
        }

        .boton {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
            font-size: 14px;
            cursor: pointer;
        }

        .eliminar {
            background: #8b3a2f;
            color: white;
        }

        .eliminar:hover {
            background: #6f2d25;
        }

        .cancelar {
            background: #7b5e3b;
            color: white;
        }

        .cancelar:hover {
            background: #60472d;
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 15px 20px;
                flex-direction: column;
                gap: 8px;
            }

            .botones {
                flex-direction: column;
            }

        }
        /* ==========================================
   MODO OSCURO - ELIMINAR ABONO
   ========================================== */

body {
    background: #1B080B;
    color: #F8EAE4;
}

/* Barra superior */
.navbar {
    background: #3B0B12;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.30);
    border-bottom: 1px solid rgba(255, 190, 170, 0.12);
}

.logo {
    color: #FF9255;
}

.usuario {
    color: #EBD2C9;
}

/* Contenedor */
.contenido {
    position: relative;
}

/* Tarjeta */
.tarjeta {
    background: rgba(74, 13, 20, 0.90);
    border: 1px solid rgba(255, 190, 170, 0.18);
    border-radius: 22px;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.30);
}

/* Icono */
.icono {
    color: #FF9255;
}

/* Título y texto */
h1 {
    color: #FFB17F;
}

.texto {
    color: #EBD2C9;
}

/* Información del abono */
.informacion {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 190, 170, 0.12);
    border-radius: 14px;
}

.informacion p {
    color: #F0DED7;
}

.informacion strong {
    color: #FFAA7A;
}

/* Botones */
.boton {
    border-radius: 999px;
    font-weight: 600;
    transition: background 0.2s ease, transform 0.2s ease;
}

.boton:hover {
    transform: translateY(-2px);
}

/* Eliminar */
.eliminar {
    background: #A52A35;
    color: #FFFFFF;
}

.eliminar:hover {
    background: #811D29;
}

/* Cancelar */
.cancelar {
    background: rgba(255, 255, 255, 0.09);
    color: #F8EAE4;
    border: 1px solid rgba(255, 190, 170, 0.20);
}

.cancelar:hover {
    background: rgba(255, 107, 53, 0.15);
    color: #FFB17F;
    border-color: #FF9255;
}

/* Adaptación móvil */
@media (max-width: 600px) {
    .tarjeta {
        padding: 25px 20px;
    }
}

    </style>

</head>


<body>

    <header class="navbar">

        <div class="logo">
            MisMary
        </div>

        <div class="usuario">

            Usuario:
            <strong>{{ user.username }}</strong>

        </div>

    </header>


    <main class="contenido">

        <div class="tarjeta">

            <div class="icono">
                ⚠️
            </div>

            <h1>
                Eliminar abono
            </h1>

            <p class="texto">

                ¿Estás seguro de que deseas eliminar
                este abono?

            </p>


            <div class="informacion">

                <p>
                    <strong>Cliente:</strong>
                    {{ abono.deuda.cliente.nombre }}
                </p>

                <p>
                    <strong>Valor:</strong>
                    ${{ abono.valor }}
                </p>

                <p>
                    <strong>Fecha:</strong>
                    {{ abono.fecha|date:"d/m/Y H:i" }}
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}

                <div class="botones">

                    <button
                        type="submit"
                        class="boton eliminar">

                        🗑️ Sí, eliminar

                    </button>


                    <a
                        href="{% url 'lista_abonos' %}"
                        class="boton cancelar">

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </main>

</body>

</html>
