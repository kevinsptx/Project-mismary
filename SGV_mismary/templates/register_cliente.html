{% extends 'layout/base.html' %}

{% block title %}
Registrar Cliente | MisMary
{% endblock %}

{% block content %}

<style>

    .registro-contenido {
        max-width: 600px;
        margin: 0 auto;
    }

    .formulario {
        background: #f5ead7;
        border: 2px solid #8b6f47;
        border-radius: 10px;
        padding: 35px;
        box-shadow:
            0 5px 15px
            rgba(70, 50, 30, 0.2);
    }

    .campo {
        margin-bottom: 22px;
    }

    .campo label {
        display: block;
        color: #5c4033;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 15px;
    }

    .campo input {
        width: 100%;
        padding: 12px;
        border: 2px solid #8b6f47;
        border-radius: 5px;
        background: white;
        color: #5c4033;
        font-size: 15px;
        outline: none;
    }

    .campo input:focus {
        border-color: #60472d;
        box-shadow:
            0 0 5px
            rgba(96, 71, 45, 0.3);
    }

    .boton {
        width: 100%;
        padding: 12px;
        background: #7b5e3b;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    .boton:hover {
        background: #60472d;
    }

    .volver {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #7b5e3b;
        text-decoration: none;
        font-size: 14px;
    }

    .volver:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {

        .formulario {
            padding: 25px;
        }

    }

</style>

<div class="registro-contenido">


<section class="titulo">

    <h1>
        Registrar Cliente
    </h1>

    <p>
        Agrega un nuevo cliente al sistema
    </p>

</section>


<form
    method="POST"
    class="formulario"
>

    {% csrf_token %}


    <!-- NOMBRE -->

    <div class="campo">

        <label for="nombre">
            Nombre
        </label>

        <input
            type="text"
            required
            maxlength="100"
            id="nombre"
            name="nombre"
            placeholder="Ingrese el nombre del cliente"
        >

    </div>


    <!-- TELEFONO -->

    <div class="campo">

        <label for="telefono">
            Teléfono
        </label>

        <input
            type="text"
            required
            maxlength="10"
            id="telefono"
            name="telefono"
            placeholder="Ingrese el teléfono"
        >

    </div>


    <!-- DIRECCION -->

    <div class="campo">

        <label for="direccion">
            Dirección
        </label>

        <input
            type="text"
            required
            maxlength="150"
            id="direccion"
            name="direccion"
            placeholder="Ingrese la dirección"
        >

    </div>


    <!-- BOTON -->

    <button
        type="submit"
        class="boton"
    >
        Registrar Cliente
    </button>


    <!-- VOLVER -->

    <a
        href="{% url 'list_cliente' %}"
        class="volver"
    >
        Volver a la lista de clientes
    </a>

</form>


</div>

{% endblock %}
