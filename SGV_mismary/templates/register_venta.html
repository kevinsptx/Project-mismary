{% extends 'layout/base.html' %}

{% block title %}
Registrar Venta | MisMary
{% endblock %}

{% block content %}

<style>

    .registro-contenido {
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
    }

    .titulo {
        text-align: center;
        margin-bottom: 25px;
    }

    .titulo h1 {
        color: #5c4033;
        font-size: 32px;
        margin-bottom: 8px;
    }

    .titulo p {
        color: #7b5e3b;
        font-size: 16px;
    }

    .formulario {
        background: #f5ead7;
        border: 2px solid #8b6f47;
        border-radius: 10px;
        padding: 35px;
        box-shadow: 0 5px 15px rgba(70, 50, 30, 0.2);
    }

    .campo {
        margin-bottom: 22px;
    }

    .campo label {
        display: block;
        color: #5c4033;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 15px;
    }

    .campo input,
    .campo select {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border: 2px solid #8b6f47;
        border-radius: 5px;
        background: white;
        color: #5c4033;
        font-size: 15px;
        outline: none;
    }

    .campo input:focus,
    .campo select:focus {
        border-color: #60472d;
        box-shadow: 0 0 5px rgba(96, 71, 45, 0.3);
    }

    .falta {
        background: white;
        border: 2px dashed #8b6f47;
        border-radius: 5px;
        padding: 12px;
        margin-bottom: 22px;
        color: #5c4033;
        font-size: 16px;
        text-align: center;
    }

    .boton {
        width: 100%;
        padding: 12px;
        background: #7b5e3b;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 15px;
        cursor: pointer;
        transition: 0.3s;
    }

    .boton:hover {
        background: #60472d;
    }

    .volver {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #7b5e3b;
        text-decoration: none;
        font-size: 14px;
    }

    .volver:hover {
        text-decoration: underline;
    }

    @media (max-width: 600px) {

        .formulario {
            padding: 25px;
        }

    }

</style>

<div class="registro-contenido">

    <section class="titulo">

        <h1>
            Registrar Venta
        </h1>

        <p>
            Registra una nueva venta por catálogo
        </p>

    </section>


    <form method="POST" class="formulario">

        {% csrf_token %}


        <!-- CLIENTE -->

        <div class="campo">

            <label for="cliente">
                Cliente
            </label>

            <select
                required
                id="cliente"
                name="cliente"
            >

                <option value="">
                    Seleccione un cliente
                </option>

                {% for cliente in clientes %}

                    <option value="{{ cliente.id }}">
                        {{ cliente.nombre }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- VALOR TOTAL -->

        <div class="campo">

            <label for="valor_total">
                Valor Total
            </label>

            <input
                type="number"
                required
                min="0"
                step="0.01"
                id="valor_total"
                name="valor_total"
                placeholder="Ingrese el valor total de la venta"
            >

        </div>


        <!-- VALOR PAGADO -->

        <div class="campo">

            <label for="valor_pagado">
                Valor pagado (0 si no ha pagado nada)
            </label>

            <input
                type="number"
                min="0"
                step="0.01"
                value="0"
                id="valor_pagado"
                name="valor_pagado"
                placeholder="¿Cuánto ha pagado el cliente?"
            >

        </div>


        <!-- CUANTO FALTA -->

        <div class="falta">
            Falta por pagar:
            <strong id="falta">$0.00</strong>
        </div>


        <!-- FECHA -->

        <div class="campo">

            <label for="fecha">
                Fecha
            </label>

            <input
                type="date"
                required
                id="fecha"
                name="fecha"
            >

        </div>


        <!-- BOTON -->

        <button
            type="submit"
            class="boton"
        >
            Registrar Venta
        </button>


        <!-- VOLVER -->

        <a
            href="{% url 'list_venta' %}"
            class="volver"
        >
            ← Volver a ventas
        </a>

    </form>

</div>


<script>

    const total = document.getElementById('valor_total');
    const pagado = document.getElementById('valor_pagado');
    const falta = document.getElementById('falta');

    function calcular() {
        const t = parseFloat(total.value) || 0;
        const p = parseFloat(pagado.value) || 0;

        falta.textContent = '$' + (t - p).toFixed(2);
    }

    total.addEventListener('input', calcular);
    pagado.addEventListener('input', calcular);

</script>

{% endblock %}
