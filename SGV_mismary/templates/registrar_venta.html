<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar venta</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            color: #1e293b;
        }
        .tarjeta {
            width: 100%;
            max-width: 420px;
            margin: 24px;
            padding: 32px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }
        h1 { margin: 0 0 4px; font-size: 1.5rem; }
        .subtitulo { margin: 0 0 24px; color: #64748b; font-size: 0.9rem; }
        .campo { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background: #4f46e5; }
        .mensaje {
            padding: 12px 14px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #dcfce7;
            color: #166534;
            font-size: 0.9rem;
        }
        .error { margin: 6px 0 0; color: #b91c1c; font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>Registrar venta</h1>
        <p class="subtitulo">Ingresa los datos del pedido por catálogo.</p>

        {% for message in messages %}
            <div class="mensaje">{{ message }}</div>
        {% endfor %}

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="campo">
                    {{ field.label_tag }}
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit">Guardar venta</button>
        </form>
    </div>
</body>
</html>
