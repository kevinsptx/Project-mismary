<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sistema de Gestión de Ventas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fondo café animado (sin cambios) */
            background: linear-gradient(160deg, #4a2c17 0%, #3a2010 45%, #2b160b 75%, #4a2c17 100%);
            background-size: 300% 300%;
            animation: gradientMove 14s ease-in-out infinite;

            font-family: 'Space Mono', monospace;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 30%; }
            50% { background-position: 100% 70%; }
            100% { background-position: 0% 30%; }
        }

        /* BLOBS DIFUMINADOS DE FONDO (sin cambios) */

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
        }

        body::before {
            width: 450px;
            height: 450px;
            background: #ff8a4c;
            opacity: 0.5;
            top: -140px;
            left: -110px;
            animation: float1 9s ease-in-out infinite;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: #ffb877;
            opacity: 0.35;
            bottom: -160px;
            right: -90px;
            animation: float2 11s ease-in-out infinite;
        }

        .blob-extra {
            position: absolute;
            width: 320px;
            height: 320px;
            background: #d9622f;
            opacity: 0.45;
            border-radius: 50%;
            filter: blur(90px);
            top: 60%;
            right: 12%;
            z-index: 0;
            animation: float3 13s ease-in-out infinite;
        }

        @keyframes float1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 30px) scale(1.08); }
        }

        @keyframes float2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-35px, -25px) scale(1.05); }
        }

        @keyframes float3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-25px, 35px) scale(1.1); }
        }


        /* ETIQUETAS TIPO STICKER DE PROMOCIÓN */

        .etiqueta-promo {
            position: absolute;
            z-index: 2;

            width: 130px;
            height: 130px;

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;

            background: linear-gradient(135deg, #ff8a4c 0%, #d9622f 100%);

            clip-path: polygon(
                50% 0%, 64.5% 14.9%, 85.4% 14.6%, 85.1% 35.5%,
                100% 50%, 85.1% 64.5%, 85.4% 85.4%, 64.5% 85.1%,
                50% 100%, 35.5% 85.1%, 14.6% 85.4%, 14.9% 64.5%,
                0% 50%, 14.9% 35.5%, 14.6% 14.6%, 35.5% 14.9%
            );

            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);

            color: #fff8f0;
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 15px;
            line-height: 1.3;

            padding: 10px;

            transform: rotate(var(--rot));

            animation: aparecerSticker 0.5s ease-out both, flotarSticker 6s ease-in-out infinite;
        }

        @keyframes aparecerSticker {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes flotarSticker {
            0%, 100% { transform: rotate(var(--rot)) translateY(0); }
            50% { transform: rotate(var(--rot)) translateY(-8px); }
        }

        .etiqueta-promo.e1 {
            --rot: -10deg;
            top: 8%;
            right: 6%;
            animation-delay: 0.9s, 1.5s;
        }

        .etiqueta-promo.e2 {
            --rot: 8deg;
            bottom: 10%;
            left: 6%;
            width: 140px;
            height: 140px;
            font-size: 14px;
            animation-delay: 1.05s, 1.5s;
        }


        /* TARJETA / RECIBO */

        .login {
            width: 380px;
            position: relative;
            z-index: 1;

            background: #fdf9f0;

            padding: 46px 34px 34px;

            /* Borde superior dentado, como papel arrancado de una máquina de tickets */
            clip-path: polygon(
                0% 4%, 6.25% 0%, 12.5% 4%, 18.75% 0%,
                25% 4%, 31.25% 0%, 37.5% 4%, 43.75% 0%,
                50% 4%, 56.25% 0%, 62.5% 4%, 68.75% 0%,
                75% 4%, 81.25% 0%, 87.5% 4%, 93.75% 0%,
                100% 4%, 100% 100%, 0% 100%
            );

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);

            animation: apparecerTarjeta 0.6s ease-out;

            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .login:hover {
            transform: scale(1.15);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.55);
        }

        @keyframes apparecerTarjeta {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* LOGO ESTILO BURBUJA */

        .logo-recibo {
            text-align: center;

            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 34px;

            color: #e8794a;

            letter-spacing: 0.5px;

            margin-bottom: 18px;

            animation: rebote 0.7s ease-out 0.2s both;
        }

        @keyframes rebote {
            0% { opacity: 0; transform: scale(0.7) translateY(-10px); }
            60% { opacity: 1; transform: scale(1.05) translateY(0); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }


        /* FRASE DESTACADA (tipo "Tag a friend...") */

        h2 {
            text-align: center;

            color: #2e2013;

            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 17px;
            line-height: 1.4;

            margin-bottom: 6px;

            animation: aparecer 0.6s ease-out 0.35s both;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }


        /* SUBTITULO */

        .subtitulo {
            text-align: center;

            color: #8a7358;

            margin-bottom: 22px;

            font-size: 12px;
            letter-spacing: 0.5px;

            animation: aparecer 0.6s ease-out 0.45s both;
        }


        /* LINEA PUNTEADA */

        .linea-punteada {
            border: none;
            border-top: 1.5px dashed #cbb999;
            margin: 16px 0;
        }


        /* CABECERA TIPO RECIBO */

        .meta-recibo {
            display: flex;
            justify-content: space-between;

            font-size: 11px;
            color: #a08a6c;

            text-transform: uppercase;
            letter-spacing: 0.5px;

            margin-bottom: 4px;
        }


        /* GRUPOS DE CAMPOS (cascada) */

        .campo {
            opacity: 0;
            animation: aparecer 0.5s ease-out both;
        }

        .campo:nth-of-type(1) { animation-delay: 0.55s; }
        .campo:nth-of-type(2) { animation-delay: 0.7s; }


        /* ETIQUETAS */

        label {
            display: block;

            margin-top: 12px;
            margin-bottom: 5px;

            font-weight: 700;
            font-size: 11px;

            color: #7a6547;

            text-transform: uppercase;
            letter-spacing: 1px;
        }


        /* CAMPOS: estilo "línea de recibo", sin caja, solo subrayado punteado */

        input {
            width: 100%;

            padding: 6px 2px 10px;

            background: transparent;

            border: none;
            border-bottom: 1.5px dashed #cbb999;

            margin-bottom: 6px;

            outline: none;

            color: #2e2013;

            font-family: 'Space Mono', monospace;
            font-size: 14px;

            transition: border-color 0.2s;
        }

        input::placeholder {
            color: #c4b49a;
        }

        input:focus {
            border-bottom-color: #e8794a;
            border-bottom-style: solid;
        }


        /* BOTÓN ESTILO "TOTAL" DEL TICKET */

        button {
            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 16px 4px 4px;

            background: transparent;
            border: none;

            cursor: pointer;

            margin-top: 14px;

            font-family: 'Space Mono', monospace;
            font-size: 15px;
            font-weight: 700;

            color: #2e2013;

            transition: transform 0.15s ease, color 0.2s ease;

            opacity: 0;
            animation: aparecer 0.5s ease-out 0.85s both;
        }

        button::before {
            content: "INICIAR SESIÓN";
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button::after {
            content: "→";
            font-size: 20px;
            color: #e8794a;
            transition: transform 0.2s ease;
        }

        button:hover {
            color: #e8794a;
        }

        button:hover::after {
            transform: translateX(4px);
        }

        button:active {
            transform: scale(0.98);
        }


        /* MENSAJE DE ERROR ESTILO "SELLO" */

        .error {
            color: #a13d2e;

            background: transparent;

            border: 2px dashed #c96a54;

            text-align: center;

            padding: 8px;

            margin-bottom: 4px;

            font-size: 12px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.5px;

            transform: rotate(-1deg);

            animation: sacudir 0.4s ease-in-out;
        }

        @keyframes sacudir {
            0%, 100% { transform: rotate(-1deg) translateX(0); }
            20% { transform: rotate(-1deg) translateX(-6px); }
            40% { transform: rotate(-1deg) translateX(6px); }
            60% { transform: rotate(-1deg) translateX(-4px); }
            80% { transform: rotate(-1deg) translateX(4px); }
        }


    </style>

</head>


<body>

    <div class="blob-extra"></div>

    <!-- Etiquetas tipo sticker de promoción -->
    <div class="etiqueta-promo e1">¡MisMary!</div>
    <div class="etiqueta-promo e2">Te amamos,<br>MisMary</div>

    <div class="login">

        <div class="logo-recibo">
            MisMary
        </div>

        <h2>
            Sistema de Gestión de Ventas
        </h2>

        <p class="subtitulo">
            Ventas por Catálogo
        </p>

        <hr class="linea-punteada">

        <div class="meta-recibo">
            <span>Acceso</span>
            <span>Requerido</span>
        </div>


        <form method="POST">

            {% csrf_token %}


            <div class="campo">
                <label for="username">
                    Usuario
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ingrese su usuario"
                    required
                >
            </div>


            <div class="campo">
                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese su contraseña"
                    required
                >
            </div>


            {% if form.errors %}

                <p class="error">
                    Usuario o contraseña incorrectos
                </p>

            {% endif %}

            <hr class="linea-punteada">

            <button type="submit"></button>

        </form>

    </div>

</body>

</html>
