{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MisMary</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>

        /* ===== PALETA Y BASE ===== */

        :root {
            --cafe-tostado:  #4A2C1B;
            --terracota:     #9E3B27;
            --naranja:       #FF6B35;
            --naranja-hover: #E85A26;
            --arena:         #E8DFC8;
            --arena-suave:   #F5EFE3;
            --marfil-bg:     #FCFAF7;
            --blanco:        #FFFFFF;

            --rojo-fondo:    #FBE9E7;

            --sombra-suave:  0 12px 30px -5px rgba(74, 44, 27, 0.09);
            --sombra-hover:  0 20px 36px -8px rgba(74, 44, 27, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--marfil-bg);
            color: var(--cafe-tostado);
            font-family:  sans-serif;

            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;

            position: relative;
            overflow: hidden;
        }

        /* ===== FONDO SUAVE ===== */

        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
        }

        body::before {
            width: 440px;
            height: 440px;
            background: var(--naranja);
            opacity: 0.18;
            top: -120px;
            left: -100px;
        }

        body::after {
            width: 400px;
            height: 400px;
            background: var(--arena);
            opacity: 0.8;
            bottom: -120px;
            right: -80px;
        }

        /* ===== TARJETA ===== */

        .login {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;

            background: var(--blanco);
            border: 1px solid var(--arena);
            border-radius: 30px;
            padding: 44px 38px 38px;
            box-shadow: var(--sombra-suave);

            animation: aparecer 0.5s ease-out;
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ===== ENCABEZADO ===== */

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            background: var(--naranja);
            color: #FFF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--sombra-suave);
            overflow: hidden;
        }

        .encabezado h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--cafe-tostado);
        }

        .encabezado p {
            margin-top: 6px;
            font-size: 16px;
            color: var(--terracota);
        }

        /* ===== MENSAJE DE ERROR ===== */

        .mensaje-error {
            background: var(--rojo-fondo);
            border: 1px solid #F5B7AB;
            color: var(--terracota);
            padding: 14px 20px;
            border-radius: 18px;
            margin-bottom: 22px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
        }

        /* ===== FORMULARIO ===== */

        .campo {
            margin-bottom: 22px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
            font-weight: 700;
            color: var(--cafe-tostado);
        }

        .campo input {
            width: 100%;
            padding: 16px 26px;
            border: 1px solid var(--arena);
            border-radius: 999px;
            font-size: 17px;
            font-family: inherit;
            color: var(--cafe-tostado);
            background: var(--blanco);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .campo input::placeholder {
            color: #B5A592;
        }

        .campo input:focus {
            outline: none;
            border-color: var(--terracota);
            box-shadow: var(--sombra-suave);
        }

        /* ===== BOTÓN ===== */

        .btn-mismary {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            background: var(--naranja);
            color: #FFF;
            padding: 16px 28px;
            border-radius: 999px;
            font-size: 17px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .btn-mismary:hover {
            background: var(--terracota);
        }

        .btn-mismary:active {
            transform: scale(0.98);
        }

        /* ===== RESPONSIVO ===== */

        @media (max-width: 500px) {
            .login {
                padding: 32px 24px 28px;
            }
            .logo {
                width: 120px;
                height: 120px;
            }
        }

    </style>

</head>


<body>

    <div class="login">

        <!-- ENCABEZADO -->
        <div class="encabezado">
            <div class="logo">
                <img src="{% static 'logo.jpeg' %}" alt="Logo MisMary" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <h1>MisMary</h1>
            <p>Sistema de Gestión de Ventas por Catálogo</p>
        </div>

        <!-- ERROR -->
        {% if form.errors %}
            <div class="mensaje-error">
                Usuario o contraseña incorrectos
            </div>
        {% endif %}

        <!-- FORMULARIO -->
        <form method="POST">

            {% csrf_token %}

            <div class="campo">
                <label for="username">Usuario</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Ingrese su usuario"
                    required
                >
            </div>

            <div class="campo">
                <label for="password">Contraseña</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese su contraseña"
                    required
                >
            </div>

            <button type="submit" class="btn-mismary">Iniciar sesión →</button>

        </form>

    </div>

</body>

</html>
