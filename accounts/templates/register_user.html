{% extends 'layout/base.html' %}

{% block title %}
Crear Usuario | MisMary
{% endblock %}

{% block content %}

<style>

    /* ===== PALETA Y BASE (igual que productos y ventas) ===== */

    :root {
        --cafe-tostado:  #4A2C1B;
        --terracota:     #9E3B27;
        --naranja:       #FF6B35;
        --naranja-hover: #E85A26;
        --arena:         #E8DFC8;
        --arena-suave:   #F5EFE3;
        --marfil-bg:     #FCFAF7;
        --blanco:        #FFFFFF;

        --verde:         #2E7D32;
        --verde-fondo:   #E8F5E9;

        --rojo-fondo:    #FBE9E7;

        --sombra-suave:  0 10px 25px -5px rgba(74, 44, 27, 0.07);
        --sombra-hover:  0 18px 32px -8px rgba(74, 44, 27, 0.12);
    }

    body {
        background-color: var(--marfil-bg);
        color: var(--cafe-tostado);
        font-family: 'Fredoka', 'Quicksand', -apple-system, sans-serif;
        min-height: 100vh;
        margin: 0;
        padding-bottom: 60px;
    }

    .wrap-mismary {
        max-width: 620px;
        margin: 0 auto;
        padding: 30px 20px;
    }

    /* ===== ENCABEZADO ===== */

    .encabezado {
        margin-bottom: 25px;
    }

    .encabezado h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        color: var(--cafe-tostado);
    }

    .encabezado p {
        margin: 4px 0 0 0;
        font-size: 14px;
        color: var(--terracota);
    }

    /* ===== MENSAJES ===== */

    .mensaje-exito {
        background: var(--verde-fondo);
        border: 1px solid #A5D6A7;
        color: var(--verde);
        padding: 14px 20px;
        border-radius: 16px;
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 600;
    }

    .mensaje-error {
        background: var(--rojo-fondo);
        border: 1px solid #F5B7AB;
        color: var(--terracota);
        padding: 14px 20px;
        border-radius: 16px;
        margin-bottom: 20px;
        font-size: 14px;
        font-weight: 600;
    }

    /* ===== FORMULARIO ===== */

    .formulario {
        background: var(--blanco);
        border: 1px solid var(--arena);
        border-radius: 24px;
        padding: 30px;
        box-shadow: var(--sombra-suave);
    }

    .campo {
        margin-bottom: 20px;
    }

    .campo label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 700;
        color: var(--cafe-tostado);
    }

    .campo input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 20px;
        border: 1px solid var(--arena);
        border-radius: 999px;
        font-size: 14px;
        font-family: inherit;
        color: var(--cafe-tostado);
        background: var(--blanco);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .campo input:focus {
        outline: none;
        border-color: var(--terracota);
        box-shadow: var(--sombra-suave);
    }

    /* ===== BOTONES ===== */

    .acciones-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 10px;
    }

    .btn-mismary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: var(--naranja);
        color: #FFF;
        text-decoration: none;
        padding: 10px 22px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        border: none;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-mismary:hover {
        background: var(--terracota);
    }

    .btn-secundario {
        background: var(--arena-suave);
        color: var(--cafe-tostado);
        border: 1px solid var(--arena);
    }

    .btn-secundario:hover {
        background: var(--blanco);
        border-color: var(--terracota);
        color: var(--terracota);
    }

    /* ===== RESPONSIVO ===== */

    @media (max-width: 700px) {
        .formulario {
            padding: 22px 18px;
        }

        .acciones-form .btn-mismary {
            flex: 1 1 100%;
        }
    }

</style>


<div class="wrap-mismary">

    <!-- ENCABEZADO -->
    <div class="encabezado">
        <h1>Crear usuario 👤</h1>
        <p>Registra un nuevo usuario en el sistema</p>
    </div>

    <!-- MENSAJES -->
    {% if messages %}
        {% for message in messages %}
            <div class="{% if message.tags == 'error' %}mensaje-error{% else %}mensaje-exito{% endif %}">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <!-- FORMULARIO -->
    <form method="POST" class="formulario">

        {% csrf_token %}

        <div class="campo">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="campo">
            <label for="first_name">Nombre</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>

        <div class="campo">
            <label for="last_name">Apellido</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>

        <div class="campo">
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>

        <div class="acciones-form">
            <button type="submit" class="btn-mismary">Crear usuario</button>
            <a href="{% url 'list_user' %}" class="btn-mismary btn-secundario">Cancelar</a>
        </div>

    </form>

</div>

{% endblock %}
