{% extends 'layout/base.html' %}

{% block content %}

<style>
    .registro-contenedor {
        max-width: 650px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 18px;
        border: 1px solid #E8DFC8;
        color: #4A2C1B;
    }

    .registro-contenedor h2 {
        color: #4A2C1B;
    }

    .registro-contenedor label {
        display: block;
        margin: 15px 0 6px;
        font-weight: bold;
    }

    .registro-contenedor input,
    .registro-contenedor select {
        width: 100%;
        padding: 12px;
        border: 1px solid #E8DFC8;
        border-radius: 10px;
        font-size: 15px;
        box-sizing: border-box;
    }

    .registro-contenedor button,
    .registro-contenedor a {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 18px;
        border: none;
        border-radius: 20px;
        background: #FF6B35;
        color: white;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
    }

    .registro-contenedor .volver {
        background: #9E3B27;
    }

    .registro-mensaje {
        padding: 12px;
        background: #f8e9df;
        border-radius: 10px;
        margin: 10px 0;
    }
</style>

<div class="registro-contenedor">

    <h2>Crear usuario</h2>
    <p>Registra una nueva cuenta y asígnale un grupo.</p>

    {% if messages %}
        {% for message in messages %}
            <div class="registro-mensaje">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label for="username">Nombre de usuario</label>
        <input type="text" id="username" name="username" required>

        <label for="first_name">Nombres</label>
        <input type="text" id="first_name" name="first_name" required>

        <label for="last_name">Apellidos</label>
        <input type="text" id="last_name" name="last_name" required>

        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <label for="grupo_id">Rol o grupo</label>
        <select id="grupo_id" name="grupo_id" required>
            <option value="">Selecciona un grupo</option>

            {% for grupo in grupos %}
                <option value="{{ grupo.id }}">{{ grupo.name }}</option>
            {% endfor %}
        </select>

        <button type="submit">Guardar usuario</button>
        <a class="volver" href="{% url 'list_user' %}">Volver</a>

    </form>

</div>

{% endblock %}
