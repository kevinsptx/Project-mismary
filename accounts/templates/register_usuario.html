{% extends 'layout/base.html' %}

{% block title %}
Crear Usuario | MisMary
{% endblock %}

{% block content %}

<style>

    /* ===== PALETA Y BASE (igual que el home) ===== */

    :root {
        --cafe-tostado:  #4A2C1B;
        --terracota:     #9E3B27;
        --naranja:       #FF6B35;
        --naranja-hover: #E85A26;
        --arena:         #E8DFC8;
        --arena-suave:   #F5EFE3;
        --marfil-bg:     #FCFAF7;
        --blanco:        #FFFFFF;

        --sombra-suave:  0 10px 25px -5px rgba(74, 44, 27, 0.07);
        --cafe-medio:    #8A5A3C;
        --sombra-caja:   0 18px 36px -8px rgba(74, 44, 27, 0.28), 0 4px 10px rgba(74, 44, 27, 0.10);
    }

    body {
        background-color: var(--marfil-bg);
        color: var(--cafe-tostado);
        font-family: 'Fredoka', 'Quicksand', -apple-system, sans-serif;
        min-height: 100vh;
        margin: 0;
        padding-bottom: 60px;
    }

    .wrap-mismary {
        max-width: 600px;
        margin: 0 auto;
        padding: 30px 20px;
    }

    .wrap-mismary * {
        box-sizing: border-box;
    }

    /* ===== ENCABEZADO ===== */

    .encabezado {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 25px;
    }

    .encabezado h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        color: var(--cafe-tostado);
    }

    .encabezado p {
        margin: 4px 0 0 0;
        font-size: 14px;
        color: var(--terracota);
    }

    /* ===== FORMULARIO ===== */

    .formulario {
        background: var(--blanco);
        border: 2px solid var(--cafe-medio);
        border-radius: 24px;
        padding: 30px;
        box-shadow: var(--sombra-caja);
    }

    .campo {
        margin-bottom: 20px;
    }

    .campo label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--cafe-tostado);
    }

    .campo input,
    .campo select {
        width: 100%;
        padding: 12px 18px;
        border: 1px solid var(--arena);
        border-radius: 999px;
        background: var(--marfil-bg);
        color: var(--cafe-tostado);
        font-family: inherit;
        font-size: 14px;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .campo input::placeholder {
        color: #A8978A;
    }

    .campo input:focus,
    .campo select:focus {
        outline: none;
        border-color: var(--terracota);
        box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.12);
    }

    .campos-fila {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    /* ===== BOTONES ===== */

    .botones {
        display: flex;
        gap: 10px;
        margin-top: 26px;
    }

    .btn-mismary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: var(--naranja);
        color: #FFF;
        text-decoration: none;
        padding: 11px 22px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 600;
        border: 1px solid transparent;
        cursor: pointer;
        font-family: inherit;
        transition: background 0.2s ease;
    }

    .btn-mismary:hover {
        background: var(--terracota);
    }

    .btn-secundario {
        background: var(--arena-suave);
        color: var(--cafe-tostado);
        border-color: var(--arena);
    }

    .btn-secundario:hover {
        background: var(--blanco);
        border-color: var(--terracota);
        color: var(--terracota);
    }

    /* ===== RESPONSIVO ===== */

    @media (max-width: 600px) {
        .encabezado {
            flex-direction: column;
            align-items: flex-start;
        }

        .formulario {
            padding: 22px 18px;
        }

        .campos-fila {
            grid-template-columns: 1fr;
            gap: 0;
        }

        .botones {
            flex-direction: column;
        }

        .botones .btn-mismary {
            width: 100%;
        }
    }

</style>


<div class="wrap-mismary">

    <!-- ENCABEZADO -->
    <div class="encabezado">
        <div>
            <h1>Crear usuario 💛</h1>
            <p>Registra una nueva cuenta y asígnale un grupo</p>
        </div>

        <a href="{% url 'list_user' %}" class="btn-mismary btn-secundario">
            ← Regresar a usuarios
        </a>
    </div>

    <!-- FORMULARIO -->
    <form method="POST" class="formulario">
        {% csrf_token %}

        <!-- USUARIO -->
        <div class="campo">
            <label for="username">Nombre de usuario</label>

            <input
                type="text"
                required
                maxlength="150"
                id="username"
                name="username"
                placeholder="Ingrese el nombre de usuario"
                autocomplete="username"
            >
        </div>

        <!-- NOMBRES Y APELLIDOS -->
        <div class="campos-fila">
            <div class="campo">
                <label for="first_name">Nombres</label>

                <input
                    type="text"
                    required
                    maxlength="150"
                    id="first_name"
                    name="first_name"
                    class="capitalizar-nombre"
                    placeholder="Ingrese los nombres"
                    autocomplete="given-name"
                >
            </div>

            <div class="campo">
                <label for="last_name">Apellidos</label>

                <input
                    type="text"
                    required
                    maxlength="150"
                    id="last_name"
                    name="last_name"
                    class="capitalizar-nombre"
                    placeholder="Ingrese los apellidos"
                    autocomplete="family-name"
                >
            </div>
        </div>

        <!-- CORREO -->
        <div class="campo">
            <label for="email">Correo electrónico</label>

            <input
                type="email"
                required
                id="email"
                name="email"
                placeholder="Ingrese el correo electrónico"
                autocomplete="email"
            >
        </div>

        <!-- CONTRASEÑA -->
        <div class="campo">
            <label for="password">Contraseña</label>

            <input
                type="password"
                required
                minlength="8"
                id="password"
                name="password"
                placeholder="Mínimo 8 caracteres"
                autocomplete="new-password"
            >
        </div>

        <!-- GRUPO -->
        <div class="campo">
            <label for="grupo_id">Rol o grupo</label>

            <select id="grupo_id" name="grupo_id" required>
                <option value="">Selecciona un grupo</option>

                {% for grupo in grupos %}
                    <option value="{{ grupo.id }}">{{ grupo.name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- BOTONES -->
        <div class="botones">
            <button type="submit" class="btn-mismary">
                Guardar usuario
            </button>

            <a href="{% url 'list_user' %}" class="btn-mismary btn-secundario">
                Cancelar
            </a>
        </div>

    </form>

</div>

{% endblock %}
